server:
  port: 6060

logging:
  level:
    com.farmorai.backend.mapper: debug

spring:
  output:
    ansi:
      enabled: always
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      enabled: true                 # 파일 업로드 활성화
      max-file-size: 50MB           # 파일 최대 크기
      max-request-size: 50MB        # 요청 최대 크기

  datasource:
    hikari:
      jdbc-url: jdbc:mysql://${DB_HOST}:3306/farmdb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      minimum-idle: 5                # 최소 유지 커넥션 수
      maximum-pool-size: 20          # 최대 커넥션 수 (트래픽 증가 대비)
      idle-timeout: 60000            # 유휴 커넥션 유지 시간 (밀리초)
      max-lifetime: 1800000          # 커넥션 최대 유지 시간 (밀리초)
      connection-timeout: 30000      # 커넥션 요청 대기 시간 (밀리초)
      pool-name: MyHikariPool        # 풀 이름 지정
      auto-commit: true              # 자동 커밋 여부
      connection-test-query: SELECT 1  # 커넥션 유효성 검사 쿼리

  auth:
    strategy: jwt        # 인증 전략: session, jwt 중 1택
  session:
    timeout: 1800000     # 세션 만료 시간 (밀리초)
  jwt:
    secret: ZmFybW9yYWlmYXJtb3JhaWZhcm1vcmFpZmFybW9yYWlmYXJtb3JhaQ==  # jwt secretKey (base64, farmorai * 5)
    expiration: 3600000  # jwt 유효시간

# 파일 업로드 경로
com:
  farmorai:
    upload:
      path: upload

fastapi:
  server:
    url: http://localhost:9090


# 네이버 페이
naver:
  pay:
    client-id: ${NAVERPAY_CLIENT_ID}
    client-secret: ${NAVERPAY_CLIENT_SECRET}
    chain-id: ${NAVERPAY_CHAIN_ID}

cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET}
